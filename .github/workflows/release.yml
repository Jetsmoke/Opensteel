# Pushing a tag like v0.2.0 builds Opensteel for Windows, Linux and macOS and publishes
# them together as one GitHub release. The release stays a draft until every build worked.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Opensteel $TAG" \
            --notes "A simple tool to remap your Steelseries Aerox 9 mouse. Installation notes: https://jetsmoke.github.io/opensteel/"
          echo "id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  windows-linux:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          releaseId: ${{ needs.draft.outputs.id }}

  macos:
    needs: draft
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: macos/build.sh
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          ditto -c -k --keepParent macos/Opensteel.app "Opensteel_${VERSION}_macOS.zip"
          gh release upload "$TAG" "Opensteel_${VERSION}_macOS.zip" --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [windows-linux, macos]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
